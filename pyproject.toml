[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-data-mexico"
version = "1.0.0"
description = "Unofficial Python client for the Mexican government open data platform (datos.gob.mx)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["mexico", "open-data", "government", "datos", "scraping"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]
pandas = [
    "pandas>=2.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.35.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "mypy>=1.0.0",
    "mkdocs-material>=9.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "hatchling>=1.25.0",
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/lehcimhdz/open-data-mexico-api"
Repository = "https://github.com/lehcimhdz/open-data-mexico-api"
"Bug Tracker" = "https://github.com/lehcimhdz/open-data-mexico-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["open_data_mexico"]
artifacts = ["open_data_mexico/py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=open_data_mexico --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["open_data_mexico"]
omit = ["open_data_mexico/_scrapers/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"]  # HTML fixtures have naturally long lines

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
