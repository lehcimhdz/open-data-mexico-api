[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-data-mexico"
version = "0.1.0"
description = "Unofficial Python client for the Mexican government open data platform (datos.gob.mx)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["mexico", "open-data", "government", "datos", "scraping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]
pandas = [
    "pandas>=2.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.35.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "hatchling>=1.25.0",
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/lehcimhdz/open-data-mexico-api"
Repository = "https://github.com/lehcimhdz/open-data-mexico-api"
"Bug Tracker" = "https://github.com/lehcimhdz/open-data-mexico-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["open_data_mexico"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
